    ${red.length ? `<div class="redacted">🔒 Redacted before sharing: ${red.map(([k, v]) => `${v} ${esc(k)}`).join(', ')}</div>` : ''}`;

  /* ---------- tiny markdown ---------- */
  function md(src) {
    const parts = String(src).split(/```(\w*)\n?([\s\S]*?)```/g);
    let html = '';
    for (let i = 0; i < parts.length; i += 3) {
      html += parts[i].split(/\n{2,}/).filter((p) => p.trim()).map((p) => '<p>' + inline(p).replace(/\n/g, '<br>') + '</p>').join('');
      if (parts[i + 2] !== undefined) html += `<pre><code>${esc(parts[i + 2].replace(/\n$/, ''))}</code></pre>`;
    }
    return html;
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/^#{1,6} (.+)$/gm, '<b>$1</b>');
  }
  function diffHtml(d) {
    const rows = [];
    for (const h of d) {
      if (h.file && d.length > 1) rows.push(`<div class="f">${esc(h.file)}</div>`);
      if (h.old) for (const l of h.old.split('\n')) rows.push(`<div class="d">- ${esc(l)}</div>`);
      if (h.new) for (const l of h.new.split('\n')) rows.push(`<div class="a">+ ${esc(l)}</div>`);
    }
    return `<div class="diff">${rows.join('')}</div>`;
  }

  /* ---------- events ---------- */
  const E = D.events;
  function render(e, i) {
    const el = document.createElement('div');
    el.id = 'e' + i;
    if (e.kind === 'user') { el.className = 'ev user'; el.textContent = e.text; }
    else if (e.kind === 'assistant') { el.className = 'ev assistant'; el.innerHTML = md(e.text); }
    else if (e.kind === 'thinking') { el.className = 'ev thinking'; el.textContent = e.text; el.onclick = () => el.classList.toggle('open'); }
    else {
      el.className = 'ev tool' + (e.isError ? ' err' : '') + (e.diff ? ' edit' : '');
      const lines = e.lines ? `<span class="tlines"><span class="a">+${e.lines.added}</span> <span class="d">−${e.lines.removed}</span></span>` : '';
      const sum = e.diff ? base(e.file) + (e.files && e.files.length > 1 ? ` +${e.files.length - 1}` : '') : e.summary;
      el.innerHTML = `<div class="tool-head"><span class="dot"></span><span class="tname">${esc(e.name)}</span><span class="tsum" title="${esc(e.summary)}">${esc(sum)}</span>${lines}</div>
        <div class="tool-body">${e.diff ? (e.file ? `<div class="lbl path">${esc(e.file)}</div>` : '') + diffHtml(e.diff) : ''}
        ${e.input ? `<div class="lbl">Input</div><pre>${esc(e.input)}</pre>` : ''}
        ${e.output ? `<div class="lbl">${e.isError ? 'Error' : 'Output'}</div><pre>${esc(e.output)}</pre>` : ''}</div>`;
      el.querySelector('.tool-head').onclick = () => el.classList.toggle('open');
      if (e.diff || e.isError) el.classList.add('open');
    }
    return el;
  }

  /* ---------- schedule: condensed time ---------- */
  // Real gaps are squeezed into 0.35–2.5s so a 2-hour session plays in minutes,
  // with a bit of extra hold for long messages so they're readable.
  const sched = [];
  let acc = 0;
  for (let i = 0; i < E.length; i++) {
    if (i > 0) {
      const prev = E[i - 1];
      const gap = (E[i].t && prev.t) ? Math.max(0, E[i].t - prev.t) : 800;
      const read = prev.kind === 'user' || prev.kind === 'assistant' ? Math.min(3000, (prev.text || '').length * 12) : 0;
      acc += Math.min(2500, Math.max(350, gap / 4)) + read;
    }
    sched.push(acc);
  }
  const total = acc + 1200;

  // Markers on the track
  const track = $('track');
  E.forEach((e, i) => {
    const cls = e.kind === 'user' ? 'u' : e.isError ? 'x' : e.diff ? 'e' : null;
    if (!cls) return;
    const m = document.createElement('div');
    m.className = 'mk ' + cls;
    m.style.left = (sched[i] / total * 100) + '%';
    track.appendChild(m);
  });

  /* ---------- player ---------- */
  const feed = $('feed');
  let shown = 0, clock = 0, playing = false, last = 0, speed = 1;

  function showUpTo(n, animate) {
    n = Math.max(0, Math.min(E.length, n));
    if (n < shown) { feed.innerHTML = ''; shown = 0; }
    const frag = document.createDocumentFragment();
    let lastEl = null;
    while (shown < n) { lastEl = render(E[shown], shown); if (!animate) lastEl.style.animation = 'none'; frag.appendChild(lastEl); shown++; }
    if (lastEl) {
      feed.appendChild(frag);
      if (animate) lastEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }
  function ui() {
    const p = Math.min(1, clock / total);
    $('fill').style.width = (p * 100) + '%';
    $('clock').textContent = `${shown} / ${E.length} events`;
    $('play').textContent = playing ? '❚❚' : (shown >= E.length ? '↺' : '▶');
    $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function tick(now) {
    if (!playing) return;
    clock += (now - last) * speed; last = now;
    let n = shown;
    while (n < E.length && sched[n] <= clock) n++;
    if (n !== shown) showUpTo(n, true);
    if (shown >= E.length && clock >= total) { playing = false; }
    ui();
    if (playing) requestAnimationFrame(tick);
  }
  function play() {
    if (shown >= E.length) { clock = 0; showUpTo(0); }
    playing = true; last = performance.now(); requestAnimationFrame(tick); ui();
  }
  function pause() { playing = false; ui(); }
  function seekTo(n) {
    pause();
    showUpTo(n, false);
    clock = n > 0 ? sched[n - 1] : 0;
    const el = $('e' + (n - 1));
    if (el) el.scrollIntoView({ block: 'center' });
    ui();
  }

  $('play').onclick = () => (playing ? pause() : play());
  $('speed').onchange = (ev) => { speed = Number(ev.target.value); };
  $('all').onclick = () => { seekTo(E.length); clock = total; ui(); };
  $('theme').onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('agentreplay-theme', r.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem('agentreplay-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

  track.onclick = (ev) => {
    const r = track.getBoundingClientRect();
    const target = (ev.clientX - r.left) / r.width * total;
    let n = 0; while (n < E.length && sched[n] <= target) n++;
    seekTo(n);
  };
  document.addEventListener('keydown', (ev) => {
    if (ev.target.tagName === 'SELECT') return;
    if (ev.code === 'Space') { ev.preventDefault(); playing ? pause() : play(); }
    else if (ev.key === 'ArrowRight') seekTo(shown + 1);
    else if (ev.key === 'ArrowLeft') seekTo(shown - 1);
    else if (ev.key === 'End') $('all').click();
    else if (ev.key === 'Home') seekTo(0);
  });

  // Deep link: #e42 opens the replay at event 42. ?static shows everything at once.
  const m = location.hash.match(/^#e(\d+)$/);
  if (m) { seekTo(Number(m[1]) + 1); }
  else if (/[?&]static\b/.test(location.search)) { $('all').click(); }
  else { showUpTo(1, false); clock = sched[0]; ui(); setTimeout(play, 600); }
})();
</script>
</body>
</html>
