<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fbfaf7; --ink: #1b1b19; --muted: #6c6a63; --faint: #a3a198; --rule: #e6e4dd; --soft: #f2f1ec;
  --accent: #2a50d8; --add: #1a7f37; --add-bg: #e9f6ec; --del: #c4321f; --del-bg: #fcebe8; --warn: #c4321f;
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --ink: #ecebe5; --muted: #908e86; --faint: #5d5c56; --rule: #262522; --soft: #1a1a18;
    --accent: #86a8ff; --add: #56d364; --add-bg: #12261a; --del: #ff7b72; --del-bg: #2d1514; --warn: #ff7b72;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --ink: #ecebe5; --muted: #908e86; --faint: #5d5c56; --rule: #262522; --soft: #1a1a18;
  --accent: #86a8ff; --add: #56d364; --add-bg: #12261a; --del: #ff7b72; --del-bg: #2d1514; --warn: #ff7b72;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
code, pre, .mono { font-family: var(--mono); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 48px 24px 140px; }

/* ---------- header ---------- */
.meta { font: 12px/1.4 var(--mono); color: var(--muted); letter-spacing: .02em; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.meta b { color: var(--ink); font-weight: 600; }
h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.12; letter-spacing: -.025em; font-weight: 650; margin: 14px 0 32px; max-width: 28ch; overflow-wrap: anywhere; }
.figures { display: flex; flex-wrap: wrap; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.fig { padding: 14px 28px 14px 0; margin-right: 28px; border-right: 1px solid var(--rule); min-width: 92px; }
.fig:last-child { border-right: 0; margin-right: 0; }
.fig .n { font: 500 22px/1.2 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fig .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.fig .add { color: var(--add); } .fig .del { color: var(--del); }

/* ---------- layout ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 56px; margin-top: 40px; align-items: start; }
@media (max-width: 920px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 40px; } .side { order: 2; } }
.side { position: sticky; top: 24px; font-size: 13px; }
@media (max-width: 920px) { .side { position: static; } }
.side section { padding: 14px 0 18px; border-top: 1px solid var(--rule); }
.side section:first-child { border-top-color: var(--ink); }
.side h2 { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.rows .k { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .v { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rows .file { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.rows .file i { color: var(--faint); font-style: normal; }
.rows .strong .k, .rows .strong .v { color: var(--ink); font-weight: 600; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 10px 0 0; }
.bar { display: inline-block; height: 2px; background: var(--ink); vertical-align: middle; margin-right: 8px; opacity: .55; }

/* ---------- transcript ---------- */
.log { min-width: 0; }
.ev { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 16px; padding: 10px 0; scroll-margin: 120px; }
.ev + .ev { border-top: 1px solid transparent; }
.ev.turn { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 22px; }
.ev.turn:first-child { border-top: 0; margin-top: 0; padding-top: 4px; }
.t { font: 11px/22px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
.who { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 8px; }
.ev.new { animation: rise .28s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ev.new { animation: none; } }

.user .body { font-size: 17px; line-height: 1.5; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; border-left: 2px solid var(--accent); padding-left: 14px; }
.user .who { color: var(--accent); }
.say .body { overflow-wrap: anywhere; max-width: 68ch; }
.say .body p { margin: 0 0 10px; } .say .body p:last-child { margin-bottom: 0; }
.say .body ul, .say .body ol { margin: 0 0 10px; padding-left: 20px; }
.say .body pre { background: var(--soft); padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 0 0 10px; border-left: 2px solid var(--rule); }
.say .body :not(pre) > code { font-size: .88em; background: var(--soft); padding: 1px 5px; }
.think .body { color: var(--muted); font-style: italic; font-size: 14px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.think.open .body { display: block; }

.tool { padding: 3px 0; }
.tool .line { display: flex; align-items: baseline; gap: 10px; min-width: 0; cursor: pointer; font-size: 13.5px; padding: 3px 0; }
.tool .line:hover .nm { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.tool .g { font: 12px var(--mono); width: 12px; flex: none; color: var(--add); }
.tool.err .g { color: var(--warn); }
.tool .nm { font: 500 13px var(--mono); flex: none; }
.tool .sum { color: var(--muted); font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.tool .dl { font: 12px var(--mono); flex: none; }
.dl .a { color: var(--add); } .dl .d { color: var(--del); }
.tool .detail { display: none; margin: 6px 0 8px 22px; border-left: 1px solid var(--rule); padding-left: 14px; }
.tool.open .detail { display: block; }
.detail .lbl { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 10px 0 4px; }
.detail .lbl:first-child { margin-top: 0; }
.detail .path { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-bottom: 6px; }
.detail pre { margin: 0; background: var(--soft); padding: 10px 12px; font-size: 12px; line-height: 1.55; overflow: auto; max-height: 340px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff { font: 12px/1.55 var(--mono); overflow: auto; max-height: 420px; background: var(--soft); }
.diff div { padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .a { background: var(--add-bg); color: var(--add); }
.diff .d { background: var(--del-bg); color: var(--del); }
.diff .f { color: var(--muted); padding-top: 6px; }
@media (max-width: 600px) {
  .wrap { padding: 28px 16px 140px; }
  .ev { grid-template-columns: minmax(0, 1fr); }
  .t { text-align: left; line-height: 1; margin-bottom: 2px; }
  .ev:not(.turn) .t { display: none; }
  .fig { padding-right: 18px; margin-right: 18px; min-width: 0; }
  .fig .n { font-size: 18px; }
}

/* ---------- player ---------- */
.player { position: fixed; inset: auto 0 0 0; background: var(--bg); border-top: 1px solid var(--rule); z-index: 10; }
.pin { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; }
.play { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--ink); flex: none; }
.play:hover { background: var(--ink); color: var(--bg); }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.track { position: relative; flex: 1; height: 26px; cursor: pointer; min-width: 80px; touch-action: none; }
.track .rail { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--rule); }
.track .fill { position: absolute; left: 0; top: 12px; height: 2px; background: var(--ink); }
.track .head { position: absolute; top: 8px; width: 2px; height: 10px; background: var(--ink); transform: translateX(-1px); }
.track .mk { position: absolute; top: 18px; width: 1px; height: 5px; background: var(--faint); }
.mk.u { background: var(--accent); height: 7px; top: 17px; width: 2px; }
.mk.x { background: var(--warn); }
.mk.e { background: var(--add); }
.count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 64px; text-align: right; }
.speeds { display: flex; font: 12px var(--mono); border: 1px solid var(--rule); }
.speeds button { padding: 5px 8px; color: var(--muted); border-left: 1px solid var(--rule); }
.speeds button:first-child { border-left: 0; }
.speeds button[aria-pressed="true"] { color: var(--bg); background: var(--ink); }
.speeds button:not([aria-pressed="true"]):hover { color: var(--ink); }
.txt { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.txt:hover { color: var(--ink); }
.icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; display: block; }
.icon { color: var(--muted); } .icon:hover { color: var(--ink); }
@media (max-width: 700px) {
  .pin { padding: 10px 16px; gap: 12px; }
  .speeds button:not([aria-pressed="true"]) { display: none; }
  .speeds button { border-left: 0; }
  .count, .hide-sm { display: none; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); font: 12px/1.6 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <div class="cols">
    <main class="log" id="log" aria-live="polite"></main>
    <aside class="side" id="side"></aside>
  </div>
  <footer id="foot"></footer>
</div>
<div class="player">
  <div class="pin">
    <button class="play" id="play"></button>
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div><div class="head" id="phead"></div></div>
    <span class="count" id="count"></span>
    <div class="speeds" id="speeds" role="group"></div>
    <button class="txt hide-sm" id="all"></button>
    <button class="icon" id="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></button>
  </div>
</div>

  // #e42 opens at event 42; ?static shows everything at once.
  const m = HASH.match(/^#e(\d+)$/);
  if (m) seekTo(Number(m[1]) + 1);
  else if (qs.has('static')) $('all').click();
  else { showUpTo(1, false); at = sched[0]; ui(); setTimeout(play, 700); }
})();
</script>
</body>
</html>
